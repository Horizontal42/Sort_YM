[throttle]
# Пауза между запросами к API, секунды
fetch_batch_delay = 0.4
lyrics_request_delay = 0.25
apply_request_delay = 0.3
# Таймаут одного запроса, секунды (библиотека по умолчанию ставит 5 - мало при медленной сети)
request_timeout = 20

[fetch]
# Сколько id треков в одном батч-запросе client.tracks(...) / client.artists(...)
batch_size = 100

[classify]
# Минимальный размер под-жанровой группы (fine, lang), чтобы получить отдельный плейлист.
# Меньшие группы схлопываются в родительскую крупную корзину (rock/indie-alt/...).
small_group_min = 12

[digest]
# Сколько исполнителей показывать в дайджесте (out/digest.md) поимённо.
# Остальные схлопываются в одну строку "ещё N исполнителей".
top_artists = 40
# Сколько альбомов показывать поимённо; остальные - в одну строку с метрикой "альбомы vs синглы".
top_albums = 15

[ollama]
# Локальная Ollama для разбора текстов песен (sort_ym analyze).
host = "http://localhost:11434"
model = "qwen3.6-35b-a3b:latest"
# Любое изменение промпта или схемы ответа => +1. Старые записи кэша станут невалидными
# и будут переанализированы, а это ~3 часа на полную библиотеку - не менять просто так.
prompt_version = 1
# Таймаут одного запроса, секунды. В пилоте худший трек занял 84с, 600 - запас ~7x.
timeout = 600
# Сколько Ollama держит модель загруженной между треками (иначе перезагрузка на каждый трек).
keep_alive = "30m"

[paths]
token_file = ".token"
cache_dir = "cache"
out_dir = "out"
